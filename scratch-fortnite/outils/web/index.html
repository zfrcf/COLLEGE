<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="stage" width="480" height="360"></canvas>
<script src="scratch-vm.js"></script><script src="scratch-render.js"></script><script src="scratch-storage.js"></script><script src="scratch-svg-renderer.js"></script>
<script>
window.log = [];
window.onerror = (m) => { window.log.push('ERREUR ' + m); };
(async () => {
  const vm = new window.VirtualMachine(); window.vm = vm;
  const SS = window.ScratchStorage; const storage = new (SS.ScratchStorage || SS.default || SS)(); vm.attachStorage(storage);
  const canvas = document.getElementById('stage');
  const renderer = new window.ScratchRender(canvas); vm.attachRenderer(renderer); window.renderer = renderer;
  if (window.ScratchSVGRenderer && window.ScratchSVGRenderer.BitmapAdapter) vm.attachV2BitmapAdapter(new window.ScratchSVGRenderer.BitmapAdapter());
  vm.setCompatibilityMode(true);
  const buf = await (await fetch('projet.sb3')).arrayBuffer();
  await vm.loadProject(buf);
  vm.postIOData('mouse', { x: 240, y: 180, isDown: false, canvasWidth: 480, canvasHeight: 360 });
  vm.start(); vm.greenFlag();
  window.pret = true;
})().catch(e => window.log.push('ERREUR ' + e));
</script></body></html>
